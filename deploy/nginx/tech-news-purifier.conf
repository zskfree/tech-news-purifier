server {
    listen 23654 default_server;
    listen [::]:23654 default_server;
    server_name _;
    server_tokens off;
    autoindex off;

    root /var/lib/tech-news-purifier/podcast;

    location = / { return 404; }

    location = /feed.xml {
        try_files /feed.xml =404;
        default_type application/rss+xml;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /cover.png {
        try_files /cover.png =404;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ^~ /audio/ {
        try_files $uri =404;
        types { audio/mpeg mp3; }
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ^~ /chapters/ {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / { return 404; }
}
